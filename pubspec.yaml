name: bible_depth
description: A new Flutter project.
publish_to: 'none'

version: 1.0.5+16

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_screenutil: ^5.9.3
  # device_preview: ^1.2.0
  cupertino_icons: ^1.0.2
  google_fonts: ^6.2.1
  equatable: ^2.0.5
  flutter_bloc: ^9.1.0
  get_it: ^7.6.2
  get: ^4.6.6
  get_storage: ^2.1.1
  # invert_colors: ^0.0.4
  # package_info: ^2.0.2
  path_provider: ^2.1.2
  finger_painter: ^1.1.0
  uuid: ^4.2.2
  html: ^0.15.4
  windows1251: ^2.0.0
  flutter_svg: ^2.0.10+1
  flutter_slidable: ^3.0.1
  package_info: ^2.0.2
  meta: ^1.9.1
  share: ^2.0.4
  translit: ^2.0.1
  receive_sharing_intent: ^1.6.8
  url_launcher: ^6.2.6
  intl: ^0.19.0
 # flutter_launcher_icons: ^0.13.1
  freezed_annotation: ^2.4.4
  data:
    path: data
  domain:
    path: domain
  shared:
    path: shared
  injectable: any
  
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.8
  injectable_generator: any
  # for generation: flutter packages pub run build_runner build
  freezed: ^2.5.7
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1
  dartz: ^0.10.1


flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/bible/rst.json
    - assets/icons/structural_law_icons/
    - assets/images/image.png
    - assets/icons/logo.svg


  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
        - asset: assets/fonts/Montserrat-Italic.ttf
          style: italic
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages
flutter_launcher_icons:
    android: "launcher_icon"
    ios: true
    image_path: "assets/icons/launch_icon.png"
    min_sdk_android: 21 # android min sdk min:16, default 21
    remove_alpha_ios: true
    web:
      generate: true
      image_path: "assets/icons/launch_icon.png"
      background_color: "#ffffff"
      theme_color: "#ffffff"
    windows:
      generate: true
      image_path: "assets/icons/launch_icon.png"
      icon_size: 48 # min:48, max:256, default: 48
    macos:
      generate: true
      image_path: "assets/icons/launch_icon.png"